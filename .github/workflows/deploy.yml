# ============================================================================
# deploy.yml — Blockfall → GitHub Pages. OWNED BY SA3.
# push to main -> build (vite) -> upload dist -> deploy to Pages.
# Requires Pages previously enabled (see DEPLOYMENT.md). This workflow does
# NOT enable Pages itself.
# ============================================================================
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Scan for secrets
        run: node scripts/scan-secrets.mjs
      - run: npm run build --if-present
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
